name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download Stats Card
        run: |
          curl -o assets/stats.svg "https://github-readme-stats.vercel.app/api?username=ninhgiang225&show_icons=true&bg_color=0a0a0a&title_color=ffffff&icon_color=ffffff&text_color=888888&border_color=222222&include_all_commits=true"

      - name: Download Top Languages Card
        run: |
          curl -o assets/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=ninhgiang225&layout=compact&bg_color=0a0a0a&title_color=ffffff&text_color=888888&border_color=222222"

      - name: Download Streak Card
        run: |
          curl -o assets/streak.svg "https://streak-stats.demolab.com/?user=ninhgiang225&background=0a0a0a&stroke=222222&ring=ffffff&fire=ffffff&currStreakLabel=ffffff&sideLabels=888888&currStreakNum=ffffff&sideNums=888888&dates=555555&border=222222&timezone=Asia%2FHo_Chi_Minh"

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: update GitHub stat cards" || exit 0
          git push